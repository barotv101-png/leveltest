<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>세진클래스 영어 레벨테스트</title>
<style>
  :root{
    --ink:#16213A;
    --ink-soft:#4A5568;
    --paper:#F7F8F6;
    --card:#FFFFFF;
    --accent:#3454D1;
    --accent-soft:#E8EDFB;
    --line:#E2E5EA;
    --ok:#1E9E6A;
    --warn:#D14343;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:var(--paper);color:var(--ink);
    display:flex;flex-direction:column;
    max-width:480px;margin:0 auto;
    overscroll-behavior:none;
  }

  /* ===== 프로그레스: 파트별 분절 바 (순서가 전부) ===== */
  header{padding:16px 20px 10px}
  .brand{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase}
  .seg-wrap{display:flex;gap:5px;margin-top:10px}
  .seg{flex:1;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
  .seg .fill{position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
  .seg.speaking .fill{background:var(--ok)}
  .part-label{margin-top:7px;font-size:12px;color:var(--ink-soft);font-weight:600;min-height:16px}

  /* ===== 메인 ===== */
  main{flex:1;display:flex;flex-direction:column;padding:8px 20px 110px;overflow-y:auto}
  .qnum{font-size:13px;font-weight:700;color:var(--accent);margin:14px 0 6px}
  .qtitle{font-size:20px;font-weight:700;line-height:1.45;word-break:keep-all}
  .qtitle .blank{color:var(--accent);font-weight:800}

  .choices{margin-top:22px;display:flex;flex-direction:column;gap:10px}
  .choice{
    background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;font-size:16px;font-weight:500;line-height:1.4;
    display:flex;align-items:center;gap:12px;cursor:pointer;
    transition:border-color .15s,background .15s;
    user-select:none;
  }
  .choice .key{
    width:26px;height:26px;border-radius:8px;flex:none;
    background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--ink-soft);
  }
  .choice.selected{border-color:var(--accent);background:var(--accent-soft)}
  .choice.selected .key{background:var(--accent);border-color:var(--accent);color:#fff}
  .choice:active{transform:scale(.985)}
  .choice.dunno{border-style:dashed;background:transparent;color:var(--ink-soft);margin-top:4px}
  .choice.dunno .key{background:transparent;border-style:dashed}
  .choice.dunno.selected{border-style:solid;border-color:var(--ink-soft);background:#EEF0F3;color:var(--ink)}
  .choice.dunno.selected .key{background:var(--ink-soft);border-color:var(--ink-soft);color:#fff}

  /* ===== 인트로 / 결과 ===== */
  .center-block{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:left;padding-bottom:40px}
  .big-title{font-size:27px;font-weight:800;line-height:1.35;word-break:keep-all}
  .big-title em{font-style:normal;color:var(--accent)}
  .desc{margin-top:14px;font-size:15px;line-height:1.65;color:var(--ink-soft);word-break:keep-all}
  .meta-row{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-soft)}

  /* ===== 스피킹 ===== */
  .speak-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:22px 20px;margin-top:22px}
  .speak-step{font-size:13px;font-weight:700;color:var(--ok);margin-bottom:8px}
  .play-btn,.rec-btn{
    width:100%;border:none;border-radius:var(--radius);padding:16px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:opacity .15s;
  }
  .play-btn{background:var(--ink);color:#fff;margin-bottom:12px}
  .play-btn:disabled{opacity:.4}
  .rec-btn{background:var(--accent);color:#fff}
  .rec-btn.recording{background:var(--warn);animation:pulse 1.2s infinite}
  .rec-btn:disabled{opacity:.35;cursor:default}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}
  .attempt-note{margin-top:12px;font-size:13px;color:var(--ink-soft);text-align:center}
  .attempt-note strong{color:var(--ink)}
  .rec-status{margin-top:10px;font-size:14px;font-weight:600;text-align:center;min-height:20px}
  .rec-status.done{color:var(--ok)}
  .speak-hint{margin-top:16px;font-size:13px;line-height:1.6;color:var(--ink-soft);background:var(--paper);border-radius:10px;padding:12px 14px}

  /* ===== 결과 ===== */
  .score-line{margin-top:20px;display:flex;align-items:baseline;gap:8px}
  .score-line .num{font-size:56px;font-weight:800;letter-spacing:-.02em}
  .score-line .total{font-size:18px;color:var(--ink-soft);font-weight:600}
  .band{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .band h3{font-size:16px;margin-bottom:8px}
  .band p{font-size:14px;line-height:1.65;color:var(--ink-soft);word-break:keep-all}
  .weak-list{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
  .weak-chip{background:#FBEAEA;color:var(--warn);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700}

  /* ===== 하단 고정 버튼 ===== */
  footer{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:480px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 70%,transparent);
  }
  .next-btn{
    width:100%;padding:17px;border:none;border-radius:var(--radius);
    background:var(--ink);color:#fff;font-size:17px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:opacity .2s;
  }
  .next-btn:disabled{opacity:.25;cursor:default}
  .next-btn.accent{background:var(--accent)}

  @media (prefers-reduced-motion:reduce){
    .seg .fill{transition:none}
    .rec-btn.recording{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">SEJINCLASS · LEVEL TEST</div>
  <div class="seg-wrap" id="segWrap"></div>
  <div class="part-label" id="partLabel"></div>
</header>

<main id="main"></main>

<footer>
  <button class="next-btn" id="nextBtn" disabled>다음</button>
</footer>

<script>
/* =====================================================
   세진클래스 레벨테스트 — 프로토타입 v1
   구조: 인트로 → MCQ 16 → 스피킹 안내 → 스피킹 3 → 결과
   서버 연동 지점은 submitAll() 참고
===================================================== */

const PARTS = [
  {id:'A', label:'Part A · 문장의 뼈대', range:[0,2]},
  {id:'B', label:'Part B · 문장 안의 문장', range:[3,4]},
  {id:'C', label:'Part C · 명사 뒤 확장', range:[5,6]},
  {id:'D', label:'Part D · 문장 앞뒤 확장', range:[7,8]},
  {id:'E', label:'Part E · 시간 구조', range:[9,11]},
  {id:'S', label:'Speaking · 듣고 답하기', range:[12,14], speaking:true},
];

const MCQ = [
  // [문항, 보기4, 정답인덱스, 영역] — 12문항: 5형식 3, 명사절 2, 관계대명사 2, 부사절 2, 시제 3
  ['The movie made her ___.', ['sadly','sad','sadness','to sad'], 1, '5형식'],
  ['I heard someone ___ my name from across the street.', ['called','call','to call','calls'], 1, '5형식'],
  ['The committee, after months of heated debate, finally considered the proposal ___.', ['acceptably','acceptable','accept','to accepting'], 1, '5형식'],
  ["___ or not the project will succeed depends on next quarter's results.", ['That','Whether','What','If'], 1, '명사절'],
  ['The real problem is ___ nobody in the meeting was willing to take responsibility.', ['what','that','which','whether'], 1, '명사절'],
  ['The writer ___ novel won the award last year is visiting Korea.', ['who','whom','whose','which'], 2, '관계대명사'],
  ['The research project ___ she devoted more than ten years finally produced results.', ['which','to which','whom','where'], 1, '관계대명사'],
  ["I'll send you the file as soon as I ___ back to the office.", ['will get','get','got','getting'], 1, '부사절'],
  ['___ what to say in front of the angry customers, the new employee remained silent.', ['Not knowing','Not known',"Don't know",'Not to know'], 0, '부사절'],
  ['By the time we arrived at the theater, the movie ___.', ['already started','has already started','had already started','starts'], 2, '시제'],
  ['I ___ in Seoul for ten years, and I still live here now.', ['lived','have lived','live','had lived'], 1, '시제'],
  ['If I ___ harder in school, I would have a better job now.', ['studied','had studied','study','would study'], 1, '시제'],
];

const SPEAKING = [
  {q:'Please introduce your smartphone. What do you use it for, and what do you like about it? You have 30 seconds.',
   hint:'30초 동안 본인의 스마트폰을 소개하세요. 용도, 좋은 점, 아쉬운 점 무엇이든 좋습니다.',
   limit:30,
   audio:'/audio/leveltest_q1.mp3'},
  {q:"A friend of yours is thinking about marrying his girlfriend, but he can't make up his mind. What advice would you give him? You have one minute.",
   hint:'여자친구와의 결혼을 고민하는 사람에게 1분 동안 상담하듯 답하세요.',
   limit:60,
   audio:'/audio/leveltest_q2.mp3'},
  {q:'Your friend keeps watching stock prices go up and down, and he is afraid of missing out. He wants to put all his money into the market right now. What advice would you give him? You have one minute.',
   hint:'자산 가격 변동으로 주식 포모(FOMO)에 시달리는 사람에게 1분 동안 조언하세요.',
   limit:60,
   audio:'/audio/leveltest_q3.mp3'},
];

const MAX_ATTEMPTS = 3; // 녹음 시도 제한
let lastError = '';
const DUNNO = 4;        // '모르겠음' 선택값 — 오답 처리, 별도 집계

/* ---------- 상태 ---------- */
let step = -2;                 // -2: 인트로, -1: 참가자 정보, 0~11: MCQ, 12: 스피킹 안내, 13~15: 스피킹, 16: 결과, 17: 완료
const participant = {name:'', email:''};
const answers = new Array(12).fill(null);
const recordings = [null,null,null];      // Blob
const attempts = [0,0,0];
let mediaRecorder = null, chunks = [], recording = false;

const main = document.getElementById('main');
const nextBtn = document.getElementById('nextBtn');
const segWrap = document.getElementById('segWrap');
const partLabel = document.getElementById('partLabel');

/* ---------- 프로그레스 ---------- */
PARTS.forEach(p=>{
  const s = document.createElement('div');
  s.className = 'seg' + (p.speaking ? ' speaking' : '');
  s.innerHTML = '<div class="fill"></div>';
  segWrap.appendChild(s);
});

function updateProgress(){
  const segs = segWrap.children;
  PARTS.forEach((p,i)=>{
    const [a,b] = p.range;
    const totalQ = b - a + 1;
    let done = 0;
    // step 기준: MCQ는 step 0~11이 문항 0~11, 스피킹은 step 13~15가 문항 12~14
    const cur = step <= 11 ? step : (step >= 13 && step <= 15 ? step - 1 : (step >= 16 ? 15 : 11.5));
    if (cur >= b + 1) done = totalQ;
    else if (cur >= a) done = cur - a + (step >= 16 ? 1 : 0);
    if (step >= 16) done = totalQ;
    segs[i].querySelector('.fill').style.transform = `scaleX(${Math.min(done/totalQ,1)})`;
  });
  const curPart = PARTS.find(p=>{
    const cur = step <= 11 ? step : step - 1;
    return cur >= p.range[0] && cur <= p.range[1];
  });
  partLabel.textContent = (step >= 0 && step !== 12 && step < 16 && curPart) ? curPart.label : '';
}

/* ---------- 렌더 ---------- */
function render(){
  updateProgress();
  window.scrollTo(0,0);
  if (step === -2) return renderIntro();
  if (step === -1) return renderContact();
  if (step <= 11) return renderMCQ(step);
  if (step === 12) return renderSpeakIntro();
  if (step <= 15) return renderSpeaking(step - 13);
  if (step === 16) return renderResult();
  return renderDone();
}

function renderIntro(){
  main.innerHTML = `
    <div class="center-block">
      <div class="big-title">영어, 아는 것과<br><em>사용하는 것</em>은 다릅니다</div>
      <p class="desc">이 테스트는 점수를 매기기 위한 것이 아니라, 지금 당신의 머릿속에서 영어 문장의 구조를 어디까지 인지할 수 있는지 진단합니다. 문장이 길어질수록 무너지는 지점이 곧 학습의 시작점입니다.<br><br>모르는 문제는 찍지 말고 <strong>'모르겠음'</strong>을 선택하세요. 찍어서 맞힌 정답은 진단을 흐립니다.</p>
      <div class="meta-row">
        <span class="chip">객관식 12문항</span>
        <span class="chip">듣고 답하기 3문항</span>
        <span class="chip">약 10분</span>
      </div>
    </div>`;
  nextBtn.textContent = '시작하기';
  nextBtn.classList.add('accent');
  nextBtn.disabled = false;
}

function renderMCQ(i){
  const [q, choices] = [MCQ[i][0], MCQ[i][1]];
  const keys = ['a','b','c','d'];
  main.innerHTML = `
    <div class="qnum">Q${i+1} / 12</div>
    <div class="qtitle">${q.replace('___','<span class="blank">___</span>')}</div>
    <div class="choices">
      ${choices.map((c,j)=>`
        <div class="choice ${answers[i]===j?'selected':''}" data-idx="${j}">
          <span class="key">${keys[j]}</span><span>${c}</span>
        </div>`).join('')}
      <div class="choice dunno ${answers[i]===DUNNO?'selected':''}" data-idx="${DUNNO}">
        <span class="key">?</span><span>모르겠음</span>
      </div>
    </div>`;
  main.querySelectorAll('.choice').forEach(el=>{
    el.addEventListener('click',()=>{
      answers[i] = Number(el.dataset.idx);
      main.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected');
      nextBtn.disabled = false;
    });
  });
  nextBtn.textContent = i === 11 ? 'Part 1 완료' : '다음';
  nextBtn.classList.remove('accent');
  nextBtn.disabled = answers[i] === null;
}

function renderSpeakIntro(){
  main.innerHTML = `
    <div class="center-block">
      <div class="big-title">이제 <em>듣고 답하기</em></div>
      <p class="desc">질문이 음성으로 재생됩니다. 질문을 듣고 영어로 답을 녹음하세요.<br><br>· 질문 재생은 <strong>2회</strong>까지 가능합니다<br>· 녹음은 문항당 <strong>최대 ${MAX_ATTEMPTS}회</strong>까지 다시 할 수 있습니다<br>· 조용한 곳에서 진행하세요</p>
      <div class="meta-row"><span class="chip">🎙 마이크 권한이 필요합니다</span></div>
    </div>`;
  nextBtn.textContent = '듣고 답하기 시작';
  nextBtn.classList.add('accent');
  nextBtn.disabled = false;
}

function renderSpeaking(i){
  const s = SPEAKING[i];
  main.innerHTML = `
    <div class="qnum">Speaking ${i+1} / 3 · 답변 시간 ${s.limit}초</div>
    <div class="qtitle">질문을 듣고 영어로 답하세요</div>
    <div class="speak-card">
      <div class="speak-step">STEP 1 · 질문 듣기</div>
      <button class="play-btn" id="playBtn">▶ 질문 재생 <span id="playCount">(2회 남음)</span></button>
      <div class="speak-step" style="margin-top:14px">STEP 2 · 답변 녹음</div>
      <button class="rec-btn" id="recBtn" disabled>● 녹음 시작</button>
      <div class="rec-status" id="recStatus"></div>
      <div class="attempt-note">남은 녹음 기회 <strong id="attemptLeft">${MAX_ATTEMPTS - attempts[i]}</strong>회</div>
    </div>
    <div class="speak-hint">💡 ${s.hint}</div>`;

  let playsLeft = 2;
  const playBtn = document.getElementById('playBtn');
  const recBtn = document.getElementById('recBtn');
  const recStatus = document.getElementById('recStatus');

  /* 질문 재생 — 녹음 파일(audio 경로) 우선, 파일이 없거나 로드 실패 시 TTS 폴백 */
  playBtn.addEventListener('click',()=>{
    if (playsLeft <= 0) return;
    playsLeft--;
    document.getElementById('playCount').textContent = `(${playsLeft}회 남음)`;
    if (playsLeft === 0) playBtn.disabled = true;
    recBtn.disabled = false;

    if (s.audio){
      const a = new Audio(s.audio);
      a.onerror = ()=>{ // 파일 없음 → TTS 폴백
        const u = new SpeechSynthesisUtterance(s.q);
        u.lang = 'en-US'; u.rate = 0.92;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      };
      a.play().catch(()=>a.onerror());
    } else {
      const u = new SpeechSynthesisUtterance(s.q);
      u.lang = 'en-US'; u.rate = 0.92;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
  });

  /* 녹음 — 문항별 시간 제한 (30초/60초), 초과 시 자동 종료 */
  let recTimer = null;
  recBtn.addEventListener('click', async ()=>{
    if (recording){
      mediaRecorder.stop();
      return;
    }
    if (attempts[i] >= MAX_ATTEMPTS) return;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = ()=>{
        clearInterval(recTimer);
        stream.getTracks().forEach(t=>t.stop());
        recordings[i] = new Blob(chunks, {type: mediaRecorder.mimeType || 'audio/webm'});
        attempts[i]++;
        recording = false;
        recBtn.classList.remove('recording');
        recBtn.textContent = attempts[i] < MAX_ATTEMPTS ? '● 다시 녹음' : '녹음 완료';
        recBtn.disabled = attempts[i] >= MAX_ATTEMPTS;
        document.getElementById('attemptLeft').textContent = MAX_ATTEMPTS - attempts[i];
        recStatus.textContent = '✓ 녹음 저장됨';
        recStatus.classList.add('done');
        nextBtn.disabled = false;
      };
      mediaRecorder.start();
      recording = true;
      recBtn.classList.add('recording');
      recBtn.textContent = '■ 녹음 중지';
      recStatus.classList.remove('done');

      let remain = s.limit;
      recStatus.textContent = `녹음 중… 남은 시간 ${remain}초`;
      recTimer = setInterval(()=>{
        remain--;
        if (remain <= 0){
          clearInterval(recTimer);
          if (recording) mediaRecorder.stop(); // 시간 초과 자동 종료
          return;
        }
        recStatus.textContent = `녹음 중… 남은 시간 ${remain}초`;
      }, 1000);
    }catch(err){
      recStatus.textContent = '마이크 권한을 허용해주세요';
    }
  });

  nextBtn.textContent = i === 2 ? '테스트 완료' : '다음';
  nextBtn.classList.remove('accent');
  nextBtn.disabled = recordings[i] === null;
}

function renderResult(){
  const score = answers.reduce((sum,a,i)=> sum + (a === MCQ[i][2] ? 1 : 0), 0);
  const weakAreas = getWeakAreas();

  let band, msg;
  if (score <= 4){
    band = '문장 뼈대부터';
    msg = '문장 구조 인식이 아직 잡히지 않은 상태입니다. 구조(220 리딩)와 영어식 사고 회로(콜로케이션)를 동시에 쌓는 1단계 병행 과정이 가장 효율적입니다.';
  } else if (score <= 8){
    band = '부분 지식, 영역별 구멍';
    msg = '아는 문법과 긴 문장에서 작동하는 문법은 다릅니다. 무너지는 영역을 중심으로 1단계에서 구조 읽기를 재훈련하는 것이 필요합니다.';
  } else {
    band = '문법 지식 보유';
    msg = '문법 지식은 충분합니다. 다만 220 리딩은 지식이 아니라 긴 문장을 구조로 읽는 훈련입니다. 1단계를 빠르게 통과할 것으로 예상되며, 순서는 전부입니다.';
  }

  main.innerHTML = `
    <div class="center-block" style="justify-content:flex-start;padding-top:24px">
      <div class="big-title">객관식 진단 결과</div>
      <div class="score-line"><span class="num">${score}</span><span class="total">/ 12</span></div>
      <div class="band">
        <h3>${band}</h3>
        <p>${msg}</p>
        ${weakAreas.length ? `<div class="weak-list">${weakAreas.map(a=>`<span class="weak-chip">${a} 취약</span>`).join('')}</div>` : ''}
      </div>
      <div class="band" style="margin-top:12px">
        <h3>스피킹 정밀 분석</h3>
        <p>녹음하신 답변 3건은 별도로 분석됩니다. 아는 문법이 실제 발화에서 작동하는지 — 객관식 점수만으로는 보이지 않는 것을 진단해서 안내해 드립니다.</p>
      </div>
    </div>`;
  nextBtn.textContent = '스피킹 분석 신청하기';
  nextBtn.classList.add('accent');
  nextBtn.disabled = false;
  nextBtn.onclick = ()=> submitAll(participant.name, participant.email);
}

function renderContact(){
  main.innerHTML = `
    <div class="center-block" style="justify-content:flex-start;padding-top:24px">
      <div class="big-title">결과를 받아볼<br>정보를 입력해 주세요</div>
      <p class="desc">진단 결과와 스피킹 분석을 입력하신 이메일로 보내드립니다.</p>
      <div class="band" style="margin-top:20px">
        <div style="display:flex;flex-direction:column;gap:12px">
          <input id="ctName" type="text" placeholder="이름" autocomplete="name" value="${participant.name}" style="padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;outline-color:var(--accent)">
          <input id="ctEmail" type="email" inputmode="email" autocapitalize="off" autocomplete="email" placeholder="이메일 주소" value="${participant.email}" style="padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;outline-color:var(--accent)">
        </div>
        <p style="margin-top:12px;font-size:12.5px;color:var(--ink-soft);line-height:1.5">입력하신 정보는 레벨테스트 결과 안내 및 학습 상담 목적으로만 사용됩니다.</p>
      </div>
    </div>`;
  const name = document.getElementById('ctName');
  const email = document.getElementById('ctEmail');
  const valid = ()=> name.value.trim().length >= 2 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  const check = ()=>{
    participant.name = name.value.trim();
    participant.email = email.value.trim();
    nextBtn.disabled = !valid();
  };
  name.addEventListener('input', check);
  email.addEventListener('input', check);
  nextBtn.textContent = '테스트 시작';
  nextBtn.classList.add('accent');
  check();
}

function renderDone(){
  if (lastError){
    main.innerHTML = `
      <div class="center-block" style="justify-content:flex-start;padding-top:24px">
        <div class="big-title">전송에 실패했습니다</div>
        <p class="desc">답안은 브라우저에 남아 있습니다. 아래 버튼으로 다시 시도해 주세요.</p>
        <div class="band" style="margin-top:18px"><p style="font-size:12.5px;word-break:break-all">${lastError}</p></div>
      </div>`;
    nextBtn.textContent = '다시 제출하기';
    nextBtn.classList.add('accent');
    nextBtn.disabled = false;
    nextBtn.onclick = ()=>{ lastError=''; submitAll(participant.name, participant.email); };
    return;
  }
  main.innerHTML = `
    <div class="center-block">
      <div class="big-title">제출 완료</div>
      <p class="desc">스피킹 답변 분석이 시작되었습니다. 입력하신 이메일로 정밀 진단 결과와 함께 안내해 드리겠습니다.</p>
    </div>`;
  nextBtn.textContent = '완료';
  nextBtn.classList.remove('accent');
  nextBtn.disabled = true;
  nextBtn.onclick = null;
}

function getWeakAreas(){
  const areaWrong = {};
  answers.forEach((a,i)=>{
    if (a !== MCQ[i][2]){
      const area = MCQ[i][3];
      areaWrong[area] = (areaWrong[area]||0)+1;
    }
  });
  return Object.entries(areaWrong).filter(([,n])=>n>=2).map(([a])=>a);
}

/* ---------- 구글 시트 제출 (Apps Script 웹훅) ---------- */
/* 배포 후 Apps Script 웹 앱 URL을 여기에 붙여넣기 */
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbz4JqPQzJ98JPVxXpXnx5-tYx_PfbbpthEEDc8ALq1sUu09DLyLfTFYg4mJcfBafsVjLQ/exec';

function blobToBase64(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

async function submitAll(name, email){
  nextBtn.disabled = true;
  nextBtn.textContent = '제출 중…';
  const score = answers.reduce((s,a,i)=> s + (a === MCQ[i][2] ? 1 : 0), 0);

  try{
    const audioB64 = [];
    for (const blob of recordings){
      audioB64.push(blob ? await blobToBase64(blob) : null);
    }
    const payload = {
      name, email, score,
      answers: answers,
      weakAreas: getWeakAreas(),
      dunnoCount: answers.filter(a=>a===DUNNO).length,
      audio: audioB64,
      audioMime: recordings[0] ? (recordings[0].type || 'audio/webm') : 'audio/webm',
      submittedAt: new Date().toISOString()
    };
    if (WEBHOOK_URL.startsWith('http')){
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: {'Content-Type':'text/plain;charset=utf-8'}, // preflight 회피용 — Apps Script 표준 패턴
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const txt = await res.text();
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (txt.indexOf('"ok":true') === -1) throw new Error('서버 응답: ' + txt.slice(0,120));
    } else {
      console.log('WEBHOOK_URL 미설정 — 제출 데이터:', payload);
    }
    step = 17;
    render();
  }catch(e){
    lastError = String(e && e.message ? e.message : e);
    step = 17;
    render();
  }
}

/* ---------- 다음 버튼 ---------- */
nextBtn.addEventListener('click',()=>{
  if (step >= 16) return; // 결과 화면부터는 개별 onclick이 처리
  step++;
  nextBtn.onclick = null;
  render();
});

render();
</script>
</body>
</html>
